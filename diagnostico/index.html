<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#335e50">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="ArPec PASTO">
<title>Diagnóstico PASTO ArPec</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: barra fixa + coluna única de trabalho (campo, celular); relatório em "folha A4" branca para leitura e impressão */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --fg:#1d2420; --muted:#5f6862; --line:#d8ddd6;
  --accent:#335e50; --accent-ink:#ffffff; --accent-soft:#e4eee3; --brand2:#5e9a1e;
  --good:#3f7a1c; --mid:#8a6a12; --bad:#9b3326;
  --paper:#ffffff; --ink:#1b1b1b; --ink-2:#555555; --rule:#b9b9b9; --tint:#efefef;
  --f-ui:"Source Sans 3",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-head:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131715; --surface:#1b201d; --fg:#e5e9e5; --muted:#9ba49e; --line:#2e3531;
  --accent:#8cc26a; --accent-ink:#10200a; --accent-soft:#24301f; --brand2:#8cc26a;
  --good:#7fc39a; --mid:#d9b55a; --bad:#e58a7c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131715; --surface:#1b201d; --fg:#e5e9e5; --muted:#9ba49e; --line:#2e3531;
  --accent:#8cc26a; --accent-ink:#10200a; --accent-soft:#24301f; --brand2:#8cc26a;
  --good:#7fc39a; --mid:#d9b55a; --bad:#e58a7c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px}

/* topo */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-head);font-size:1.15rem;font-weight:600;letter-spacing:.01em}
.brand img{height:26px;width:auto;align-self:center}
.brand-mark{background:#fff;border-radius:6px;padding:2px 4px;display:flex}
#curName{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}

h1,h2,h3{font-family:var(--f-head);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:1.6rem}
h2{font-size:1.25rem}
.lead{color:var(--muted);margin:.25rem 0 0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* lista */
.list-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card .nm{font-weight:700;font-size:1.05rem}
.card .meta{color:var(--muted);font-size:.85rem}
.card .sc{grid-row:1/3;grid-column:2;text-align:right}
.card .sc b{font-size:1.5rem;font-variant-numeric:tabular-nums;font-family:var(--f-head)}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid currentColor}
.c-5,.c-4{color:var(--good)} .c-3{color:var(--mid)} .c-2,.c-1{color:var(--bad)} .c-0{color:var(--muted)}
.tag-ex{font-size:.72rem;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:0 6px;margin-left:6px;font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.note{font-size:.85rem;color:var(--muted);margin-top:10px}

/* editor */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:4px 0 16px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;min-width:56px;line-height:1.2}
.tab b{font-family:var(--f-head);font-size:1.05rem}
.tab small{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab.on small{color:var(--accent-ink);opacity:.85}
.panel{display:grid;gap:14px}
.phead{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.phead .row{display:flex;justify-content:space-between;align-items:start;gap:12px}
.phead .big{font-family:var(--f-head);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.concept{color:var(--muted);font-size:.92rem;margin:0}
.scale{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted)}
.scale b{color:var(--fg)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.item-h{display:flex;gap:10px;align-items:baseline}
.code{font-size:.75rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:26px}
.item h3{font-family:var(--f-ui);font-size:1rem;font-weight:700}
.hint{margin:0;color:var(--muted);font-size:.88rem}
.score{display:grid;grid-template-columns:repeat(5,1fr) 1.2fr;gap:6px}
.score button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 0;font-weight:700;font-variant-numeric:tabular-nums}
.score button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.score button.na{font-size:.8rem;font-weight:600;color:var(--muted)}
.score button.na[aria-pressed="true"]{color:var(--accent-ink)}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:42px}
.obs{font-size:.9rem}
.q{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:6px 10px;font-size:.85rem;font-weight:600;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
.form .full{grid-column:1/-1}
.parecer-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.logo-prev{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo-prev img{max-height:48px;max-width:180px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
@media (max-width:560px){
  .form{grid-template-columns:1fr}
  .q{grid-template-columns:1fr}
  #curName{display:none}
  .btn{padding:7px 10px}
}

/* relatório (folha) */
.rep-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.rep-bar .sp{margin-right:auto}
.msg{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;font-size:.88rem;margin-bottom:12px}
.sheet-scroll{overflow-x:auto}
.sheet{background:var(--paper);color:var(--ink);width:100%;max-width:794px;margin:0 auto;padding:40px 44px;border:1px solid var(--line);box-shadow:0 2px 12px rgba(0,0,0,.08);font:10pt/1.45 var(--f-ui)}
.sheet h1,.sheet h2,.sheet h3{color:var(--ink)}
.r-head{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1.5px solid var(--ink);padding-bottom:10px}
.r-logo img{height:46px;width:auto;max-width:220px}
.r-word{font-family:var(--f-head);font-size:15pt;font-weight:600}
.r-word small{display:block;font-family:var(--f-ui);font-size:8pt;font-weight:400;color:var(--ink-2);letter-spacing:.08em;text-transform:uppercase}
.r-title{text-align:right}
.r-title h1{font-size:14pt;line-height:1.2}
.r-title p{margin:2px 0 0;color:var(--ink-2);font-size:9.5pt}
.r-id{width:100%;border-collapse:collapse;margin:12px 0 4px;font-size:9.5pt}
.r-id td{padding:3px 6px;border-bottom:1px solid var(--tint);vertical-align:top}
.r-id td.k{color:var(--ink-2);width:20%;white-space:nowrap}
.sheet h2{font-size:12pt;margin:20px 0 8px;padding-bottom:3px;border-bottom:1px solid var(--rule);break-after:avoid}
.sheet h3{font-size:11pt;margin:16px 0 6px;break-after:avoid}
.sheet p{margin:0 0 7px}
.r-sum{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
.r-index{text-align:center;border:1px solid var(--rule);padding:12px 8px}
.r-index .n{font-family:var(--f-head);font-size:30pt;line-height:1;font-variant-numeric:tabular-nums}
.r-index .l{font-size:8pt;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.r-index .c{font-weight:700;margin-top:4px}
.r-radar svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
table.rt{width:100%;border-collapse:collapse;font-size:9.5pt;margin:6px 0 10px}
table.rt th{text-align:left;font-weight:700;border-bottom:1.2px solid var(--ink);padding:4px 6px;font-size:8.5pt;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
table.rt td{padding:4px 6px;border-bottom:1px solid var(--tint);vertical-align:top}
table.rt tr{break-inside:avoid}
table.rt .num{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;width:48px}
.bar{height:7px;background:var(--tint);position:relative;min-width:80px}
.bar i{position:absolute;inset:0 auto 0 0;background:#666}
.r-pil{break-inside:auto}
.r-pil-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 0 4px;border-bottom:1px solid var(--rule);padding-bottom:3px;break-after:avoid}
.r-pil-h h2{border:0;margin:0;padding:0}
.r-pil-h .s{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.r-concept{color:var(--ink-2);font-size:9.3pt}
.r-quote{font-family:var(--f-head);font-style:italic;color:var(--ink-2);border-left:2px solid var(--rule);padding-left:10px;margin:8px 0 4px}
.r-lbl{font-size:8.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);margin:10px 0 3px}
.sheet ul{margin:0 0 8px;padding-left:18px}
.sheet li{margin-bottom:3px}
.r-legend{font-size:8.5pt;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:8px;margin-top:20px}
.r-sign{margin-top:40px;text-align:center;font-size:9.5pt}
.r-sign .ln{width:260px;max-width:100%;border-top:1px solid var(--ink);margin:0 auto 4px}
@media (max-width:640px){
  .sheet{padding:22px 16px}
  .r-sum{grid-template-columns:1fr}
  .r-head{flex-direction:column;align-items:flex-start}
  .r-title{text-align:left}
}

@media print{
  @page{size:A4;margin:14mm 14mm 16mm}
  body{background:#fff}
  body::before,.top,.rep-bar,.msg,#vList,#vEdit{display:none!important}
  .wrap{padding:0;max-width:none}
  .sheet{border:0;box-shadow:none;padding:0;max-width:none}
  .sheet-scroll{overflow:visible}
  .r-sum{grid-template-columns:200px 1fr}
  .r-pil,.r-brk{break-before:page}
  .r-pil-h{margin-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="brand-mark"><img id="topLogo" alt="ArPec Consultoria"></span><b>Diagnóstico PASTO</b><span id="curName">ArPec Consultoria</span></div>
    <nav class="nav" aria-label="Seções">
      <button class="btn" id="navList" type="button">Diagnósticos</button>
      <button class="btn" id="navEdit" type="button">Avaliação</button>
      <button class="btn pri" id="navRep" type="button">Relatório</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="vList"></section>
  <section id="vEdit" hidden></section>
  <section id="vRep" hidden></section>
</main>

<script>
/* ===================== Conteúdo do método ===================== */
const ESCALA = [
  [1,'Inexistente','não existe ou prejudica a equipe'],
  [2,'Incipiente','existe de modo informal ou esporádico'],
  [3,'Parcial','existe, mas sem regularidade ou não alcança todos'],
  [4,'Implantado','funciona com regularidade, com falhas pontuais'],
  [5,'Consolidado','faz parte da cultura, é medido e melhorado']
];
const CLASSES = [[4.5,'Excelente'],[3.5,'Boa'],[2.5,'Regular'],[1.5,'Ruim'],[0,'Muito Ruim']];

const PASTO = [
{k:'P', nome:'Propósito e Direção',
 conceito:'A equipe precisa conhecer o sistema de produção e onde a fazenda quer chegar. Quem entende a lógica do próprio trabalho deixa de executar por obrigação. Todos devem conhecer os macro-objetivos, com uma rotina de alinhamento dos objetivos e da execução semanal.',
 frase:'Pessoa sem direção cumpre ordem. Pessoa com direção é parceira do resultado.',
 niveis:{
  alto:'A fazenda tem direção clara e a equipe conhece os objetivos que orientam o trabalho. O desafio agora é manter o alinhamento vivo, revisitando as metas com frequência.',
  medio:'Existem objetivos, mas eles ainda não chegam de forma clara e constante a toda a equipe. Parte do trabalho é feita por obrigação, sem o entendimento de onde a fazenda quer chegar.',
  baixo:'A equipe trabalha sem conhecer os objetivos econômicos e produtivos da fazenda. Nessa condição, as pessoas cumprem ordens, mas não se tornam parceiras do resultado.'},
 itens:[
  {id:'p1',t:'Objetivo econômico',d:'A fazenda tem meta econômica clara (custo da @, margem, retorno) e a equipe sabe qual é.',rec:'Definir a meta econômica em números simples (ex.: custo máximo da @, margem desejada) e apresentá-la à equipe.'},
  {id:'p2',t:'Objetivo produtivo',d:'Metas de produção definidas (prenhez, desmama, GMD, idade de abate, lotação) e entendidas pela equipe.',rec:'Traduzir o sistema de produção em 3 a 5 metas produtivas e mostrar a cada setor como seu trabalho contribui para elas.'},
  {id:'p3',t:'Ambiente de trabalho desejado',d:'A fazenda definiu que tipo de ambiente de trabalho quer construir.',rec:'Definir com o proprietário e a liderança o ambiente de trabalho que a fazenda quer construir e registrar por escrito.'},
  {id:'p4',t:'Comportamento e postura esperados',d:'O que se espera da equipe em comportamento e postura está claro e foi comunicado.',rec:'Formalizar as expectativas de comportamento e postura e comunicá-las a todos, inclusive na contratação de novos colaboradores.'},
  {id:'p5',t:'Visão de 1 a 4 anos',d:'Existe um plano de onde a fazenda quer estar em 1, 2, 3 e 4 anos, compartilhado com a liderança.',rec:'Construir a visão de 1 a 4 anos com o proprietário e apresentá-la à liderança da fazenda.'},
  {id:'p6',t:'Rotina de alinhamento de objetivos',d:'Há uma rotina para alinhar os objetivos e a execução semanal com a equipe.',rec:'Implantar a reunião semanal de alinhamento como rotina fixa, com dia, hora e pauta curta.'}
 ]},
{k:'A', nome:'Ambiente e Acolhimento',
 conceito:'Tudo começa na base: bom ambiente de trabalho, moradia digna e bom relacionamento. Antes de cobrar comportamento, a fazenda precisa oferecer condições em que ela mesma gostaria de trabalhar.',
 frase:'Quem não cuida do ambiente, depois reclama do comportamento.',
 niveis:{
  alto:'O ambiente de trabalho é respeitoso e a estrutura oferecida à equipe é adequada. Essa base favorece a permanência das pessoas e a abertura para mudanças.',
  medio:'O ambiente tem pontos positivos, mas há falhas de estrutura ou de relacionamento que pesam no dia a dia e limitam o comprometimento da equipe.',
  baixo:'As condições de trabalho, moradia ou relacionamento com a liderança estão abaixo do necessário. Sem corrigir essa base, outras ações de gestão de pessoas terão pouco efeito.'},
 itens:[
  {id:'a1',t:'Respeito',d:'As pessoas são tratadas com respeito no dia a dia, por colegas e pela liderança.',rec:'Estabelecer o respeito como regra inegociável, com conversa direta da liderança sobre como as pessoas devem ser tratadas.'},
  {id:'a2',t:'Escuta',d:'A equipe é ouvida e tem espaço para falar sem medo.',rec:'Criar momentos fixos para ouvir a equipe (ex.: 10 minutos ao fim da reunião semanal) e dar retorno sobre o que foi dito.'},
  {id:'a3',t:'Moradia',d:'Qualidade, conservação e conforto das casas oferecidas aos colaboradores.',rec:'Levantar a condição de cada moradia e montar um plano de reformas com prioridades e prazos.'},
  {id:'a4',t:'Refeitório e áreas comuns',d:'Condição de refeitório, banheiros e áreas de convivência.',rec:'Adequar refeitório e áreas comuns (limpeza, conforto, água, sombra) com rotina de conservação definida.'},
  {id:'a5',t:'Oficina, máquinas e ferramentas',d:'Oficina, máquinas, equipamentos e ferramentas disponíveis, organizados e em bom estado de conservação.',rec:'Fazer inventário de máquinas, equipamentos e ferramentas por setor, organizar a oficina, repor o que falta e definir responsável pela guarda e manutenção.'},
  {id:'a6',t:'Segurança do trabalho',d:'EPIs, treinamento e cuidado com riscos no manejo, máquinas e produtos.',rec:'Garantir EPIs adequados por função, treinar a equipe nos riscos de cada atividade e registrar ocorrências.'},
  {id:'a7',t:'Escala de trabalho e descanso',d:'A escala é conhecida, justa e respeita o descanso.',rec:'Definir e divulgar a escala de trabalho e folgas, com divisão justa entre a equipe.'},
  {id:'a8',t:'Relacionamento com a liderança',d:'A maneira como o líder trata e fala com as pessoas.',rec:'Trabalhar com o encarregado a forma de orientar e cobrar: firme na direção, respeitoso no trato.'},
  {id:'a9',t:'Reconhecimento',d:'O trabalho bem-feito é percebido e valorizado.',rec:'Reconhecer em público o trabalho bem-feito, de forma específica e frequente.'},
  {id:'a10',t:'Clareza das ordens',d:'As ordens são claras: o que fazer, como, até quando e por quê.',rec:'Padronizar a forma de passar tarefas: o que, como, prazo e porquê, confirmando o entendimento.'}
 ],
 perguntas:[
  {id:'g1',t:'Eu gostaria de trabalhar nas condições que ofereço?',bom:'s'},
  {id:'g2',t:'Meu encarregado orienta, ou só grita com a turma?',bom:'s',ops:['Orienta','Às vezes','Só grita']},
  {id:'g3',t:'A equipe sabe que pode falar sem medo?',bom:'s'},
  {id:'g4',t:'Existe humilhação normalizada aqui dentro?',bom:'n'},
  {id:'g5',t:'O trabalhador sente que é visto como pessoa?',bom:'s'}
 ]},
{k:'S', nome:'Sistema de Comunicação',
 conceito:'A maioria dos problemas com pessoas não nasce da má vontade, nasce de comunicação ruim. As melhores fazendas comunicam o plano, repetem a direção e fazem a equipe entender o todo. Ninguém é contra aquilo que ajuda a construir.',
 frase:'Sem alinhamento, cada setor acha que trabalha certo. E o sistema trabalha errado.',
 niveis:{
  alto:'A fazenda tem rotinas de comunicação estabelecidas e a equipe entende o plano. A informação circula e os problemas aparecem cedo.',
  medio:'A comunicação acontece, mas de forma irregular. Parte das reuniões não ocorre ou não tem pauta, e nem sempre se confirma se a equipe entendeu o que foi pedido.',

 itens:[
  {id:'s1',t:'Reunião de alinhamento semanal',d:'Organiza a semana: prioridades, problemas críticos, divisão de responsabilidades, riscos e recados curtos.',rec:'Implantar a reunião semanal com pauta fixa: prioridades, problemas críticos, responsáveis, riscos e recados.'},
  {id:'s2',t:'Reunião mensal gerencial',d:'Compara planejado e realizado: indicadores produtivos e de equipe, falhas que se repetem, pontos fortes e ajustes.',rec:'Instituir a reunião mensal gerencial comparando planejado e realizado, com lista de ajustes para o mês seguinte.'},
  {id:'s3',t:'Revisão trimestral',d:'Responde: estamos perto ou longe da meta? O problema é de processo, liderança ou execução? É preciso rever metas, pessoas ou prioridades?',rec:'Agendar revisões trimestrais com as três perguntas: distância da meta, origem dos problemas e o que precisa ser revisto.'},
  {id:'s4',t:'Reunião anual',d:'Fecha o ciclo e abre o próximo: resultados consolidados, mudanças na equipe e plano do ano seguinte.',rec:'Realizar a reunião anual de fechamento, com resultados do ano, mudanças na equipe e plano do próximo ano.'},
  {id:'s5',t:'Repetição e checagem de entendimento',d:'A liderança repete a direção sem vergonha e confirma se a pessoa entendeu.',rec:'Orientar a liderança a repetir a direção e pedir que o colaborador explique com as próprias palavras o que vai fazer.'},
  {id:'s6',t:'Explica o porquê e conecta à meta',d:'Explica não só o que fazer, mas por que fazer, ligando a tarefa ao resultado da fazenda.',rec:'Ao passar tarefas, explicar o motivo e a ligação com a meta, pedindo o retorno do que foi observado ao fim do dia.'},
  {id:'s7',t:'Canal de comunicação da equipe',d:'Grupo de WhatsApp ou similar ativo, com informação útil e objetiva.',rec:'Criar ou organizar o grupo de comunicação da equipe, com regras simples de uso e informações objetivas.'},
  {id:'s8',t:'Cultura "o erro pode aparecer"',d:'Os erros são relatados sem medo e tratados com orientação, não com punição.',rec:'Tratar erros relatados com orientação e aprendizado conjunto, para que a informação real chegue à gestão.'}
 ]},
{k:'T', nome:'Trilha de Execução e Acompanhamento',
 conceito:'Boa intenção sem rotina vira desmotivação. A execução precisa de funções claras, procedimentos simples, poucos indicadores, checklists e acompanhamento visível, com correção rápida e sem virar perseguição.',
 frase:'O ritual de prestação de contas não pode ser punitivo. Ele tem que ser evolutivo.',
 niveis:{
  alto:'A execução segue rotinas definidas e é acompanhada de forma visível. Os desvios são corrigidos rapidamente e tratados como oportunidade de melhorar o processo.',
  medio:'Há rotinas e algum acompanhamento, mas dependem da memória e da presença do gestor. Os desvios demoram a ser corrigidos ou são tratados sem identificar a causa.',
  baixo:'Funções, procedimentos e indicadores não estão definidos. O trabalho depende da memória das pessoas e a cobrança tende a acontecer só quando o problema já ocorreu.'},
 itens:[
  {id:'t1',t:'Funções claras',d:'Cada pessoa sabe o que é responsabilidade dela, o que é trabalho bem-feito e quando pedir ajuda.',rec:'Descrever as funções de cada colaborador: responsabilidades, padrão de trabalho bem-feito e quando pedir ajuda.'},
  {id:'t2',t:'Procedimentos simples',d:'Rotinas críticas padronizadas: manejo, trato, abastecimento, manutenção, registros e comunicação de problemas.',rec:'Padronizar por escrito as rotinas críticas (manejo, trato, abastecimento, manutenção, registros), em linguagem simples.'},
  {id:'t3',t:'Indicadores por área',d:'Poucos indicadores acompanhados: faltas, atrasos, retrabalho, desperdício, falhas de manejo, cumprimento da programação, acidentes, estabilidade da equipe.',rec:'Começar com 3 a 5 indicadores por área (ex.: faltas, retrabalho, falhas de manejo, cumprimento da programação).'},
  {id:'t4',t:'Checklists',d:'O trabalho sai da memória e vai para o sistema.',rec:'Criar checklists para as rotinas repetitivas (trato, abastecimento, revisão de cercas e bebedouros, manejo de curral).'},
  {id:'t5',t:'Acompanhamento visual',d:'Quadro, planilha ou app em que a equipe vê o acompanhamento.',rec:'Montar um quadro de acompanhamento visível para a equipe, atualizado semanalmente.'},
  {id:'t6',t:'Correção rápida',d:'O erro é corrigido no ato, com objetividade, sem esperar o fechamento do ano.',rec:'Corrigir desvios no momento em que ocorrem, de forma objetiva e reservada, registrando o combinado.'},
  {id:'t7',t:'Acompanhamento evolutivo',d:'Verifica se o combinado foi executado, se a qualidade foi adequada e se o desvio foi de método, capacidade ou atitude. Muda o processo antes de mudar as pessoas.',rec:'Analisar cada desvio pelas três perguntas (executado? com qualidade? desvio de método, capacidade ou atitude?) e ajustar o processo antes de trocar pessoas.'}
 ]},
{k:'O', nome:'Ownership: protagonismo, reconhecimento e evolução',
 conceito:'A equipe precisa sentir que a fazenda também é dela. Quando o trabalhador é ouvido de verdade, aprende mais, trabalha melhor e ajuda o gestor a enxergar o que não via. Competência e compromisso nascem de pertencimento, escuta e respeito.',
 frase:'Pessoas se comprometem mais naquilo que elas ajudam a construir.',
 niveis:{
  alto:'A equipe participa das decisões, é reconhecida e enxerga possibilidade de crescimento. Há líderes intermediários e o dono não é o único centro da operação.',
  medio:'Há iniciativas de escuta e reconhecimento, mas sem regularidade. A operação ainda depende muito do proprietário ou do gerente e a equipe não enxerga um caminho de crescimento.',
  baixo:'A equipe não é ouvida nem reconhecida e não há perspectiva de crescimento. A operação depende inteiramente do dono ou do gerente e o comprometimento é baixo.'},
 itens:[

  {id:'o2',t:'Reconhecer do jeito certo',d:'Reconhecimento além do dinheiro: elogio, autonomia, oportunidade de aprender, visibilidade quando faz o certo.',rec:'Usar formas de reconhecimento além do dinheiro (elogio, autonomia, treinamento, visibilidade). Bônus só depois do método implantado.'},
  {id:'o3',t:'Líderes intermediários',d:'Existem pessoas desenvolvidas para liderar frentes de trabalho; o dono não é o único centro da operação.',rec:'Identificar e desenvolver líderes intermediários, delegando frentes de trabalho com acompanhamento.'},
  {id:'o4',t:'Trilha de crescimento',d:'Degraus claros de evolução: operador júnior, sênior, encarregado, líder de frente, gestor de área.',rec:'Desenhar a trilha de crescimento (júnior, sênior, encarregado, líder de frente, gestor de área) com critérios de cada degrau.'},
  {id:'o5',t:'Consequência justa',d:'Quem entrega é valorizado; quem repete desvio é tratado com seriedade.',rec:'Definir consequências claras e justas: valorização de quem entrega e tratamento sério de desvios repetidos.'},
  {id:'o6',t:'Pertencimento e protagonismo',d:'A equipe se sente parte da fazenda e assume o resultado como seu.',rec:'Envolver a equipe na construção das soluções e atribuir a ela os resultados alcançados.'}
 ]}

function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.diags))return v;}catch(e){}return null;}
let db = load() || {diags:[exemplo()],cur:null};
let saveT=null;
function persist(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}},250);}
function getLogoCustom(){try{return localStorage.getItem(LOGO_KEY)||'';}catch(e){return '';}}
function getLogo(){return getLogoCustom()||LOGO_PADRAO;}
function setLogo(v){try{v?localStorage.setItem(LOGO_KEY,v):localStorage.removeItem(LOGO_KEY);}catch(e){}}
let ui={view:'list',tab:'id'};
const cur = ()=>db.diags.find(d=>d.id===db.cur);

/* ===================== Cálculos ===================== */
function notaPilar(d,p){const v=p.itens.map(i=>d.notas[i.id]).filter(x=>x>=1);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function notaGeral(d){const v=PASTO.map(p=>notaPilar(d,p)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function avaliados(d){return ALL_ITEMS.filter(i=>d.notas[i.id]>=1).length;}
function textoSugerido(d,p){
  const n=notaPilar(d,p); if(n==null) return '';
  const nivel=n>=3.5?'alto':n>=2.5?'medio':'baixo';
  const fortes=p.itens.filter(i=>d.notas[i.id]>=4).map(i=>lc(i.t));
  const fracos=p.itens.filter(i=>d.notas[i.id]>=1&&d.notas[i.id]<=2).map(i=>lc(i.t));
  let t=`O pilar obteve nota ${fmt(n)} (${classe(n)}). ${p.niveis[nivel]}`;
  if(fortes.length) t+=` Destaca${fortes.length>1?'m':''}-se positivamente: ${lista(fortes)}.`;
  if(fracos.length) t+=` Pede${fracos.length>1?'m':''} atenção imediata: ${lista(fracos)}.`;
  return t;
}
function prioridades(d){
  return ALL_ITEMS.filter(i=>d.notas[i.id]>=1&&d.notas[i.id]<=3)
    .map(i=>({...i,n:d.notas[i.id],prio:d.notas[i.id]<=2?'Alta':'Média',prazo:d.notas[i.id]<=1?'30 dias':d.notas[i.id]==2?'60 dias':'90 dias'}))
    .sort((a,b)=>a.n-b.n||'PASTO'.indexOf(a.pk)-'PASTO'.indexOf(b.pk));
}
function conclusaoSugerida(d){
  const g=notaGeral(d); if(g==null) return '';
  const ps=PASTO.map(p=>({p,n:notaPilar(d,p)})).filter(x=>x.n!=null).sort((a,b)=>b.n-a.n);
  const melhor=ps[0], pior=ps[ps.length-1];
  const alta=prioridades(d).filter(x=>x.prio==='Alta').length;
  let t=`A fazenda obteve Índice PASTO de ${fmt(g)} (${classe(g)}). O pilar mais desenvolvido é ${melhor.p.nome} (${fmt(melhor.n)}) e o que pede maior atenção é ${pior.p.nome} (${fmt(pior.n)}).`;
  if(alta) t+=` Foram identificados ${alta} ponto${alta>1?'s':''} de prioridade alta, que devem ser tratados primeiro.`;
  t+=' A recomendação é começar pela base (ambiente e direção) e pela rotina de comunicação, pois são elas que sustentam a execução e o comprometimento da equipe. Mudar o processo antes de mudar as pessoas.';
  return t;
}

/* ===================== Navegação ===================== */
function show(view){
  if((view==='edit'||view==='rep')&&!cur()){view='list';}
  ui.view=view;
  $('#vList').hidden=view!=='list';$('#vEdit').hidden=view!=='edit';$('#vRep').hidden=view!=='rep';
  $('#navList').classList.toggle('on',view==='list');$('#navEdit').classList.toggle('on',view==='edit');
  $('#navEdit').disabled=!cur();$('#navRep').disabled=!cur();
  const c=cur();$('#curName').textContent=c?(c.ident.fazenda||'Sem nome'):'ArPec Consultoria';
  if(view==='list')renderList(); if(view==='edit')renderEdit(); if(view==='rep')renderRep();
  window.scrollTo(0,0);
}
$('#navList').onclick=()=>show('list');
$('#navEdit').onclick=()=>show('edit');
$('#navRep').onclick=()=>show('rep');

/* ===================== Lista ===================== */
function renderList(){
  const ds=[...db.diags].sort((a,b)=>b.atual-a.atual);
  $('#vList').innerHTML=`
  <div class="list-head"><div><p class="eyebrow">Gestão de pessoas · Método PASTO</p><h1>Diagnósticos de fazendas</h1>
  <p class="lead">Avalie os 5 pilares com notas de 1 a 5 e gere o relatório para o cliente.</p></div>
  <button class="btn pri" id="bNovo" type="button">+ Novo diagnóstico</button></div>
  <div class="cards">${ds.length?ds.map(d=>{const g=notaGeral(d);return `
    <button class="card" data-open="${d.id}" type="button">
      <span class="nm">${esc(d.ident.fazenda||'Sem nome')}${d.exemplo?'<span class="tag-ex">exemplo · dados fictícios</span>':''}</span>
      <span class="meta">${esc(d.ident.municipio||'')}${d.ident.municipio?' · ':''}${dataBR(d.ident.data)} · ${avaliados(d)}/${ALL_ITEMS.length} itens avaliados</span>
      <span class="sc"><b class="${ccls(g)}">${fmt(g)}</b><br><span class="pill ${ccls(g)}">${classe(g)}</span></span>
    </button>`}).join(''):'<p class="note">Nenhum diagnóstico salvo. Toque em “Novo diagnóstico” para começar.</p>'}</div>
  <div class="tools">
    <label class="btn" for="fImp">Importar arquivo (.json)</label><input id="fImp" type="file" accept=".json,application/json" hidden>
    <button class="btn" id="bCola" type="button">Colar dados</button>
  </div>
  <div id="colaBox" class="phead" style="margin-top:12px" hidden><p class="eyebrow">Importar dados copiados</p>
    <textarea id="tCola" rows="4" placeholder="Cole aqui os dados copiados pelo botão Exportar"></textarea>
    <div><button class="btn pri" id="bColaOk" type="button">Importar</button></div></div>
  <p class="note">Os diagnósticos ficam salvos neste aparelho. Use “Exportar” no relatório para guardar uma cópia ou enviar a outro aparelho.</p>`;
  $('#bNovo').onclick=()=>{const d=novoDiag();db.diags.push(d);db.cur=d.id;persist();ui.tab='id';show('edit');};
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{db.cur=b.dataset.open;persist();ui.tab='id';show('edit');});
  const importa=txt=>{try{const v=JSON.parse(txt);const arr=Array.isArray(v.diags)?v.diags:(v.notas?[v]:[]);if(!arr.length)throw 0;
    arr.forEach(d=>{const i=db.diags.findIndex(x=>x.id===d.id);if(i>=0)db.diags[i]=d;else db.diags.push(d);});persist();renderList();
    $('#vList').insertAdjacentHTML('afterbegin',`<p class="msg">${arr.length} diagnóstico${arr.length>1?'s':''} importado${arr.length>1?'s':''}.</p>`);}catch(err){$('#vList').insertAdjacentHTML('afterbegin','<p class="msg">Não foi possível ler os dados. Verifique se foram exportados por este app.</p>');}};
  $('#fImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importa(r.result);r.readAsText(f);};
  $('#bCola').onclick=()=>{$('#colaBox').hidden=!$('#colaBox').hidden;};
  $('#bColaOk').onclick=()=>importa($('#tCola').value);
}

    <div class="phead"><p class="eyebrow">Relatório</p><h2>Logo no cabeçalho</h2>
      <div class="logo-prev"><img src="${logo}" alt="Logo atual">
      <label class="btn" for="fLogo">Trocar logo</label><input id="fLogo" type="file" accept="image/*" hidden>
      ${custom?'<button class="btn ghost" id="bLogoX" type="button">Voltar à logo ArPec</button>':''}</div>
      <p class="note" style="margin:0">${custom?'Logo própria salva neste aparelho.':'Logo ArPec padrão. Troque só se precisar de outra.'}</p></div>
    <div class="phead"><p class="eyebrow">Diagnóstico</p><div class="parecer-h"><span>Excluir este diagnóstico do aparelho</span>
      <button class="btn danger" id="bDel" type="button">Excluir</button></div></div>`;
  } else if(ui.tab==='fim'){
    body=`<div class="phead"><p class="eyebrow">Conclusão</p><h2>Considerações finais</h2>
      <div class="parecer-h"><span class="note" style="margin:0">Texto de fechamento do relatório.</span><button class="btn" id="bSugFim" type="button">Usar texto sugerido</button></div>
      <textarea id="t-conc" data-conc="conclusao" rows="6" placeholder="Se ficar em branco, o relatório usa o texto sugerido.">${esc(d.conclusao)}</textarea></div>
    <div class="phead"><p class="eyebrow">Encaminhamento</p><h2>Próximos passos</h2>
      <textarea id="t-prox" data-conc="proximos" rows="5" placeholder="Um passo por linha. Ex.: Apresentar o diagnóstico à equipe na reunião de 10/11.">${esc(d.proximos)}</textarea></div>
    <div class="pager"><button class="btn" data-tab="O" type="button">← O</button><button class="btn pri" id="bVerRep" type="button">Ver relatório →</button></div>`;
  } else {
    const p=PASTO.find(x=>x.k===ui.tab), n=notaPilar(d,p), idx=PASTO.indexOf(p);
    body=`<div class="phead"><div class="row"><div><p class="eyebrow">Pilar ${p.k}</p><h2>${esc(p.nome)}</h2></div>
      <div class="big ${ccls(n)}" id="pScore">${fmt(n)}<br><span class="pill ${ccls(n)}" style="font-size:.7rem">${classe(n)}</span></div></div>
      <p class="concept">${esc(p.conceito)}</p>
      <div class="scale">${ESCALA.map(([v,t])=>`<span><b>${v}</b> ${t}</span>`).join('')}<span><b>N/A</b> não se aplica</span></div></div>
    ${p.itens.map((it,i)=>itemHTML(d,it,p.k+(i+1))).join('')}
    ${p.perguntas?`<div class="phead"><p class="eyebrow">Perguntas ao gestor</p><p class="concept">O gestor responde com sinceridade. Não entram na nota, mas aparecem no relatório.</p>
      ${p.perguntas.map(q=>{const ops=q.ops||['Sim','Em parte','Não'];return `<div class="q"><span>${esc(q.t)}</span><div class="seg" role="group" aria-label="${esc(q.t)}">
      ${['s','p','n'].map((v,j)=>`<button type="button" data-gq="${q.id}" data-v="${v}" aria-pressed="${d.gq[q.id]===v}">${ops[j]}</button>`).join('')}</div></div>`}).join('')}</div>`:''}
    <div class="phead"><div class="parecer-h"><div><p class="eyebrow">Descritivo do pilar</p><h2>Parecer do consultor</h2></div>
      <button class="btn" id="bSug" type="button">Usar texto sugerido</button></div>
      <textarea id="t-par-${p.k}" data-par="${p.k}" rows="5" placeholder="Se ficar em branco, o relatório usa o texto sugerido a partir das notas.">${esc(d.parecer[p.k]||'')}</textarea></div>
    <div class="pager"><button class="btn" data-tab="${idx?PASTO[idx-1].k:'id'}" type="button">← ${idx?PASTO[idx-1].k:'Dados'}</button>
      <button class="btn pri" data-tab="${idx<4?PASTO[idx+1].k:'fim'}" type="button">${idx<4?PASTO[idx+1].k:'Conclusão'} →</button></div>`;
  }
  $('#vEdit').innerHTML=`<nav class="tabs" id="tabs" aria-label="Pilares">${tabsHTML(d)}</nav><div class="panel">${body}</div>`;
  bindEdit(d);
}
function itemHTML(d,it,code){
  const v=d.notas[it.id];
  return `<div class="item"><div class="item-h"><span class="code">${code}</span><h3>${esc(it.t)}</h3></div>
  <p class="hint">${esc(it.d)}</p>
  <div class="score" role="group" aria-label="Nota de ${esc(it.t)}">
   ${[1,2,3,4,5].map(n=>`<button type="button" data-sc="${it.id}" data-v="${n}" aria-pressed="${v===n}" title="${ESCALA[n-1][1]}">${n}</button>`).join('')}
   <button type="button" class="na" data-sc="${it.id}" data-v="0" aria-pressed="${v===0}">N/A</button></div>
  <textarea class="obs" id="o-${it.id}" data-obs="${it.id}" rows="1" placeholder="Observação de campo (vai para o relatório)">${esc(d.obs[it.id]||'')}</textarea></div>`;
}
function touch(d){d.atual=Date.now();persist();}
function refreshScores(d){
  $('#tabs').innerHTML=tabsHTML(d);bindTabs();
  const p=PASTO.find(x=>x.k===ui.tab); if(!p)return; const n=notaPilar(d,p);
  const el=$('#pScore'); el.className='big '+ccls(n); el.innerHTML=`${fmt(n)}<br><span class="pill ${ccls(n)}" style="font-size:.7rem">${classe(n)}</span>`;
}
function bindTabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;renderEdit();window.scrollTo(0,0);});}
function bindEdit(d){
  bindTabs();
  document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.sc,v=+b.dataset.v; if(d.notas[id]===v) delete d.notas[id]; else d.notas[id]=v;
    document.querySelectorAll(`[data-sc="${id}"]`).forEach(x=>x.setAttribute('aria-pressed',d.notas[id]===+x.dataset.v));
    touch(d);refreshScores(d);});
  document.querySelectorAll('[data-gq]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.gq,v=b.dataset.v; d.gq[id]=d.gq[id]===v?undefined:v;
    document.querySelectorAll(`[data-gq="${id}"]`).forEach(x=>x.setAttribute('aria-pressed',d.gq[id]===x.dataset.v));touch(d);});
  document.querySelectorAll('[data-obs]').forEach(t=>t.oninput=()=>{d.obs[t.dataset.obs]=t.value;touch(d);});
  document.querySelectorAll('[data-par]').forEach(t=>t.oninput=()=>{d.parecer[t.dataset.par]=t.value;touch(d);});
  document.querySelectorAll('[data-conc]').forEach(t=>t.oninput=()=>{d[t.dataset.conc]=t.value;touch(d);});
  document.querySelectorAll('[data-id]').forEach(t=>t.oninput=()=>{d.ident[t.dataset.id]=t.value;touch(d);if(t.dataset.id==='fazenda')$('#curName').textContent=t.value||'Sem nome';});
  const sug=$('#bSug'); if(sug) sug.onclick=()=>{const p=PASTO.find(x=>x.k===ui.tab);const t=textoSugerido(d,p);if(!t){sug.textContent='Dê notas primeiro';return;}d.parecer[p.k]=t;$('#t-par-'+p.k).value=t;touch(d);};
  const sf=$('#bSugFim'); if(sf) sf.onclick=()=>{const t=conclusaoSugerida(d);if(!t){sf.textContent='Dê notas primeiro';return;}d.conclusao=t;$('#t-conc').value=t;touch(d);};
  const vr=$('#bVerRep'); if(vr) vr.onclick=()=>show('rep');
  const fl=$('#fLogo'); if(fl) fl.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{
      const img=new Image();img.onload=()=>{const s=Math.min(1,400/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);setLogo(c.toDataURL('image/png'));renderEdit();};img.src=r.result;};r.readAsDataURL(f);};
  const lx=$('#bLogoX'); if(lx) lx.onclick=()=>{setLogo('');renderEdit();};
  const del=$('#bDel'); if(del) del.onclick=()=>{
    if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent='Toque de novo para excluir';setTimeout(()=>{if(del.isConnected){del.classList.remove('armed');del.textContent='Excluir';}},4000);return;}
    db.diags=db.diags.filter(x=>x.id!==d.id);db.cur=null;persist();show('list');};
}

/* ===================== Relatório ===================== */
function radarSVG(d){
  const cx=150,cy=140,R=95,N=5,ang=i=>-Math.PI/2+i*2*Math.PI/N;
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  let s=`<svg viewBox="0 0 300 275" role="img" aria-label="Radar das notas dos pilares PASTO">`;
  for(let k=1;k<=5;k++){s+=`<polygon points="${[0,1,2,3,4].map(i=>pt(i,R*k/5).join(',')).join(' ')}" fill="none" stroke="#c8c8c8" stroke-width="${k===5?1:.6}"/>`;}
  for(let i=0;i<N;i++){const [x,y]=pt(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#c8c8c8" stroke-width=".6"/>`;}
  for(let k=1;k<=5;k++){s+=`<text x="${cx+3}" y="${cy-R*k/5+3}" font-size="7" fill="#888">${k}</text>`;}
  const vals=PASTO.map(p=>notaPilar(d,p)||0);
  s+=`<polygon points="${vals.map((v,i)=>pt(i,R*v/5).join(',')).join(' ')}" fill="rgba(60,60,60,.18)" stroke="#333" stroke-width="1.6"/>`;
  vals.forEach((v,i)=>{const [x,y]=pt(i,R*v/5);s+=`<circle cx="${x}" cy="${y}" r="2.6" fill="#333"/>`;});
  PASTO.forEach((p,i)=>{const [x,y]=pt(i,R+22);const v=notaPilar(d,p);
    s+=`<text x="${x}" y="${y}" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1b1b" font-family="Georgia,serif">${p.k}</text><text x="${x}" y="${y+11}" text-anchor="middle" font-size="9" fill="#555">${fmt(v)}</text>`;});
  return s+'</svg>';
}
function buildReport(d){
  const I=d.ident,g=notaGeral(d),logo=getLogo(),prio=prioridades(d);
  const ps=PASTO.map(p=>({p,n:notaPilar(d,p)}));
  const val=ps.filter(x=>x.n!=null).sort((a,b)=>b.n-a.n);
  let leitura='';
  if(val.length){leitura=`A fazenda obteve <b>Índice PASTO de ${fmt(g)}</b>, classificado como <b>${classe(g)}</b>, resultado da média dos cinco pilares de gestão de pessoas. O pilar mais desenvolvido é <b>${esc(val[0].p.nome)}</b> (${fmt(val[0].n)})`+(val.length>1?` e o que pede maior atenção é <b>${esc(val[val.length-1].p.nome)}</b> (${fmt(val[val.length-1].n)}).`:'.')+` Foram avaliados ${avaliados(d)} de ${ALL_ITEMS.length} itens.`;}
  const idRows=[['Fazenda',I.fazenda],['Proprietário / gestor',I.gestor],['Município / UF',I.municipio],['Data da visita',dataBR(I.data)],['Sistema de produção',I.sistema],['Nº de colaboradores',I.colaboradores],['Entrevistados',I.entrevistados],['Consultor',I.consultor]].filter(r=>r[1]);
  let h=`<div class="r-head"><div class="r-logo"><img src="${logo}" alt="ArPec Consultoria"></div>
  <div class="r-title"><h1>Diagnóstico Inicial de Gestão de Pessoas</h1><p>Método PASTO · ${esc(I.fazenda||'')}</p></div></div>
  <table class="r-id">${idRows.map((r,i)=>i%2?'':`<tr><td class="k">${r[0]}</td><td>${esc(r[1])}</td>`+(idRows[i+1]?`<td class="k">${idRows[i+1][0]}</td><td>${esc(idRows[i+1][1])}</td>`:'<td></td><td></td>')+'</tr>').join('')}</table>`;
  h+=`<h2>1. Resumo do diagnóstico</h2>
  <div class="r-sum"><div class="r-index"><div class="l">Índice PASTO</div><div class="n">${fmt(g)}</div><div class="c">${classe(g)}</div><div class="l" style="margin-top:4px">escala de 1 a 5</div></div>
  <div class="r-radar">${radarSVG(d)}</div></div>
  <table class="rt"><thead><tr><th>Pilar</th><th class="num">Nota</th><th>Classificação</th><th style="width:30%">Nível</th></tr></thead><tbody>
  ${ps.map(({p,n})=>`<tr><td><b>${p.k}</b> – ${esc(p.nome)}</td><td class="num">${fmt(n)}</td><td>${classe(n)}</td><td><div class="bar"><i style="width:${n?n/5*100:0}%"></i></div></td></tr>`).join('')}
  </tbody></table>${leitura?`<p>${leitura}</p>`:'<p>Nenhum item avaliado ainda.</p>'}`;
  h+=`<h2>2. Avaliação por pilar</h2>`;
  ps.forEach(({p,n},pi)=>{
    const par=(d.parecer[p.k]||'').trim()||textoSugerido(d,p);
    const recs=p.itens.filter(i=>d.notas[i.id]>=1&&d.notas[i.id]<=3);
    h+=`<div class="r-pil"><div class="r-pil-h"><h2>2.${pi+1} ${p.k} – ${esc(p.nome)}</h2><span class="s">${fmt(n)} · ${classe(n)}</span></div>
    <p class="r-concept">${esc(p.conceito)}</p>
    <table class="rt"><thead><tr><th style="width:34px">Item</th><th>Aspecto avaliado</th><th class="num">Nota</th><th>Observação de campo</th></tr></thead><tbody>
    ${p.itens.map((it,i)=>{const v=d.notas[it.id];return `<tr><td>${p.k}${i+1}</td><td>${esc(it.t)}</td><td class="num">${v>=1?v:(v===0?'N/A':'–')}</td><td>${nl(d.obs[it.id]||'')}</td></tr>`}).join('')}
    </tbody></table>`;
    if(p.perguntas&&p.perguntas.some(q=>d.gq[q.id])){
      h+=`<div class="r-lbl">Perguntas ao gestor</div><table class="rt"><tbody>${p.perguntas.map(q=>{const ops=q.ops||['Sim','Em parte','Não'];const v=d.gq[q.id];return `<tr><td>${esc(q.t)}</td><td style="width:90px"><b>${v?ops['spn'.indexOf(v)]:'–'}</b></td></tr>`}).join('')}</tbody></table>`;
    }
    if(par) h+=`<div class="r-lbl">Parecer</div><p>${nl(par)}</p>`;
    if(recs.length) h+=`<div class="r-lbl">Recomendações</div><ul>${recs.map(i=>`<li>${esc(i.rec)}</li>`).join('')}</ul>`;
    h+=`<p class="r-quote">“${esc(p.frase)}”</p></div>`;
  });
  h+=`<h2 class="r-brk">3. Quadro de prioridades</h2>`;
  h+=prio.length?`<p>Itens com nota até 3, ordenados da menor para a maior nota. Prioridade alta para notas 1 e 2.</p>
  <table class="rt"><thead><tr><th style="width:34px">Item</th><th>Ação recomendada</th><th class="num">Nota</th><th style="width:70px">Prioridade</th><th style="width:60px">Prazo</th></tr></thead><tbody>
  ${prio.map(x=>`<tr><td>${x.code}</td><td><b>${esc(x.t)}.</b> ${esc(x.rec)}</td><td class="num">${x.n}</td><td>${x.prio}</td><td>${x.prazo}</td></tr>`).join('')}</tbody></table>`:'<p>Nenhum item com nota até 3.</p>';
  const conc=(d.conclusao||'').trim()||conclusaoSugerida(d);
  h+=`<h2>4. Considerações finais</h2>${conc?`<p>${nl(conc)}</p>`:''}`;
  const prox=(d.proximos||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(prox.length) h+=`<div class="r-lbl">Próximos passos</div><ul>${prox.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
  h+=`<div class="r-legend"><b>Escala de notas:</b> ${ESCALA.map(([v,t,x])=>`${v} – ${t} (${x})`).join('; ')}. <b>Classificação:</b> Excelente ≥ 4,5; Boa 3,5–4,4; Regular 2,5–3,4; Ruim 1,5–2,4; Muito Ruim &lt; 1,5. Itens marcados N/A não entram na média.</div>
  <div class="r-sign"><div class="ln"></div>${esc(I.consultor||'')}<br><span style="color:var(--ink-2)">ArPec Consultoria${I.municipio?' · '+esc(I.municipio):''}${I.data?', '+dataBR(I.data):''}</span></div>`;
  return h;
}
const emIframe=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
function renderRep(){
  const d=cur(); if(!d)return show('list');
  $('#vRep').innerHTML=`<div class="rep-bar"><span class="sp eyebrow">Relatório para o cliente</span>
    <button class="btn" id="bBack" type="button">← Editar</button>
    <button class="btn" id="bExp" type="button">Exportar (.json)</button>
    <button class="btn pri" id="bPdf" type="button">Gerar PDF</button></div>
    <div id="repMsg"></div>
    <div class="sheet-scroll"><article class="sheet" id="sheet">${buildReport(d)}</article></div>`;
  $('#bBack').onclick=()=>show('edit');
  $('#bPdf').onclick=()=>{
    if(emIframe){$('#repMsg').innerHTML='<p class="msg">Esta pré-visualização não permite imprimir. No app instalado no celular ou aberto no navegador, “Gerar PDF” abre a impressão: escolha “Salvar como PDF”.</p>';}
    const t=document.title;document.title='Diagnostico PASTO - '+(d.ident.fazenda||'fazenda');try{window.print();}catch(e){}setTimeout(()=>document.title=t,1000);};
  $('#bExp').onclick=()=>{
    const txt=JSON.stringify(d,null,1),nome='diagnostico-pasto-'+(d.ident.fazenda||'fazenda').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.json';
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=nome;document.body.appendChild(a);a.click();a.remove();}catch(e){}
    if(emIframe){const ok=()=>{$('#repMsg').innerHTML='<p class="msg">Dados copiados. No outro app, toque em Diagnósticos → Colar dados → cole e toque em Importar.</p>';};
      const falha=()=>{$('#repMsg').innerHTML='<p class="msg">Copie o texto abaixo (selecione tudo) e cole no outro app em Diagnósticos → Colar dados.</p><textarea rows="4" style="margin-bottom:12px" readonly>'+esc(txt)+'</textarea>';const t=$('#repMsg textarea');t.focus();t.select();};
      try{navigator.clipboard.writeText(txt).then(ok,falha);}catch(e){falha();}}
  };
}

$('#topLogo').src=LOGO_PADRAO;
show(db.cur&&cur()?'edit':'list');
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
